name: Bug Report
description: Report a bug to help us fix it
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in the sections below so the report
        carries enough context to reproduce without a round-trip.

  - type: input
    id: version
    attributes:
      label: mindctx version (`mindctx --version` output)
      placeholder: e.g. mindctx 0.1.0 (a8f3c2b, 2026-09-12)
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - npm install -g mindctx (official registry)
        - npm install -g mindctx (mirror / private registry)
        - install.sh / install.ps1 from this repo
        - cargo install mindctx (crates.io)
        - Built from source
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform (OS + arch)
      placeholder: e.g. macOS 14.5 arm64, Ubuntu 22.04 x86_64, Windows 11 x86_64
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
